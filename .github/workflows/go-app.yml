name: experimental-go-app
on:
  push:
    branches: ['**']
    paths: ['experimental/go-app/**', '.github/workflows/go-app.yml', '.npmignore']
  pull_request:
    paths: ['experimental/go-app/**', '.github/workflows/go-app.yml', '.npmignore']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-app:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: experimental/go-app
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: experimental/go-app/go.mod
          cache-dependency-path: experimental/go-app/go.sum
      - name: Linux native dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev xvfb dbus-x11 gnome-keyring
      - run: go vet -tags nogui ./...
      - run: python3 -B -m unittest discover -s packaging -p 'test_*.py'
      - run: node internal/ui/page_test.mjs
      - run: go test -tags nogui -count=5 -timeout 60s ./...
      - name: Node and Go unified routing blackbox (same mock and resource settings)
        run: |
          suffix=
          if [ "$RUNNER_OS" = Windows ]; then suffix=.exe; fi
          go build -tags nogui,routecheck -o "$RUNNER_TEMP/momo-routecheck$suffix" .
          node routecheck.mjs "$RUNNER_TEMP/momo-routecheck$suffix"
      - name: Windows and macOS synthetic native credential-store roundtrip
        if: runner.os != 'Linux'
        run: MOMO_TEST_SYSTEM_VAULT=1 go test -tags nogui -run TestSystemBackendSyntheticRoundtrip -v -count=1 -timeout 30s ./internal/vault
      - name: Linux synthetic Secret Service roundtrip (isolated CI session)
        if: runner.os == 'Linux'
        run: |
          timeout 40s dbus-run-session -- bash -c 'printf "%s\n" "synthetic-ci-keyring-only" | gnome-keyring-daemon --unlock --components=secrets; MOMO_TEST_SYSTEM_VAULT=1 go test -tags nogui -run TestSystemBackendSyntheticRoundtrip -v -count=1 -timeout 30s ./internal/vault'
      - name: Race tests
        if: runner.os != 'Windows'
        # Go's timeout covers the whole package across -count, not each pass.
        # Run all five complete passes with independent 120s watchdogs. This
        # is not a retry: any failed pass aborts, and no test/fixture is skipped.
        run: |
          for pass in 1 2 3 4 5; do
            echo "Race acceptance pass $pass/5 (no retries)"
            go test -tags nogui -race -count=1 -timeout 120s ./... || exit "$?"
          done
      - name: Native application compilation
        run: |
          tags=production
          if [ "$RUNNER_OS" = Linux ]; then tags=gtk3,production; fi
          if go list -tags "$tags" -f '{{join .GoFiles " "}}' . | grep -Eq 'appcheck|routecheck'; then echo "Probe leaked"; exit 1; fi
          if go list -tags "$tags" -f '{{join .GoFiles " "}}' ./internal/appcore | grep -Eq 'probe_mock|routecheck_mock'; then echo "Mock transport leaked"; exit 1; fi
          go vet -tags "$tags" ./...
          go build -tags "$tags" -trimpath -ldflags "-s -w" -o "$RUNNER_TEMP/momo-preview-${RUNNER_OS}-${RUNNER_ARCH}" .
      - name: Native probe compilation (never packaged)
        run: |
          tags=appcheck,production
          suffix=
          if [ "$RUNNER_OS" = Windows ]; then suffix=.exe; fi
          if [ "$RUNNER_OS" = Linux ]; then tags=appcheck,gtk3,production; fi
          go test -tags "$tags" -run '^TestProbe' -count=100 .
          go build -tags "$tags" -trimpath -o "$RUNNER_TEMP/momo-appcheck$suffix" .
      - name: Five independent WebView TCP TLS-mock E2E and shutdown passes
        run: python3 -B packaging/native_acceptance.py
      - name: Package unsigned preview
        run: |
          export PREVIEW_DIR="$RUNNER_TEMP/momo-app-preview"
          mkdir -p "$PREVIEW_DIR"
          cp README.md "$PREVIEW_DIR/README.md"
          if [ "$RUNNER_OS" = Windows ]; then
            cp "$RUNNER_TEMP/momo-preview-${RUNNER_OS}-${RUNNER_ARCH}" "$PREVIEW_DIR/momo-preview.exe"
          elif [ "$RUNNER_OS" = macOS ]; then
            mkdir -p "$PREVIEW_DIR/MOMO Preview.app/Contents/MacOS"
            cp "$RUNNER_TEMP/momo-preview-${RUNNER_OS}-${RUNNER_ARCH}" "$PREVIEW_DIR/MOMO Preview.app/Contents/MacOS/momo-preview"
            cp packaging/Info.plist "$PREVIEW_DIR/MOMO Preview.app/Contents/Info.plist"
          else
            cp "$RUNNER_TEMP/momo-preview-${RUNNER_OS}-${RUNNER_ARCH}" "$PREVIEW_DIR/momo-preview"
          fi
          python3 -c 'import os,pathlib,hashlib; p=pathlib.Path(os.environ["PREVIEW_DIR"]); rows=[hashlib.sha256(f.read_bytes()).hexdigest()+"  "+f.relative_to(p).as_posix() for f in sorted(p.rglob("*")) if f.is_file()]; (p/"SHA256SUMS").write_text("\n".join(rows)+"\n",encoding="utf-8")'
      - name: Archive with native executable permissions
        run: |
          mkdir -p "$RUNNER_TEMP/momo-app-download"
          export DOWNLOAD_DIR="$RUNNER_TEMP/momo-app-download"
          python3 -c 'import os,pathlib,tarfile; p=pathlib.Path(os.environ["DOWNLOAD_DIR"]); name="momo-preview-"+os.environ["RUNNER_OS"]+"-"+os.environ["RUNNER_ARCH"]+".tar.gz"; archive=tarfile.open(p/name,"w:gz"); archive.add(pathlib.Path(os.environ["RUNNER_TEMP"])/"momo-app-preview",arcname="."); archive.close()'
          python3 -c 'import os,pathlib,hashlib; p=pathlib.Path(os.environ["DOWNLOAD_DIR"]); rows=[hashlib.sha256(f.read_bytes()).hexdigest()+"  "+f.name for f in sorted(p.glob("*.tar.gz"))]; (p/"SHA256SUMS").write_text("\n".join(rows)+"\n",encoding="utf-8")'
      - name: Build and verify unsigned native installer
        run: python3 packaging/installers.py --ci
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-momo-preview-${{ runner.os }}-${{ runner.arch }}
          path: ${{ runner.temp }}/momo-app-download/
          if-no-files-found: error
          retention-days: 7
