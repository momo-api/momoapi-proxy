name: experimental-go-app
on:
  push:
    branches: ['**']
    paths: ['experimental/go-app/**', '.github/workflows/go-app.yml', '.npmignore']
  pull_request:
    paths: ['experimental/go-app/**', '.github/workflows/go-app.yml', '.npmignore']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-app:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: experimental/go-app
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: experimental/go-app/go.mod
          cache-dependency-path: experimental/go-app/go.sum
      - name: Linux native dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev xvfb dbus-x11
      - run: go vet -tags nogui ./...
      - run: go test -tags nogui -count=5 -timeout 60s ./...
      - name: Race tests
        if: runner.os != 'Windows'
        run: go test -tags nogui -race -count=5 -timeout 60s ./...
      - name: Native application compilation
        run: |
          tags=production
          if [ "$RUNNER_OS" = Linux ]; then tags=gtk3,production; fi
          if go list -tags "$tags" -f '{{join .GoFiles " "}}' . | grep -q appcheck; then echo "Probe leaked"; exit 1; fi
          go vet -tags "$tags" ./...
          go build -tags "$tags" -trimpath -ldflags "-s -w" -o "$RUNNER_TEMP/momo-preview-${RUNNER_OS}-${RUNNER_ARCH}" .
      - name: Native probe compilation (never packaged)
        run: |
          tags=appcheck,production
          if [ "$RUNNER_OS" = Linux ]; then tags=appcheck,gtk3,production; fi
          go build -tags "$tags" -trimpath -o "$RUNNER_TEMP/momo-appcheck" .
      - name: Linux real WebView bridge and shutdown smoke
        if: runner.os == 'Linux'
        run: |
          timeout 40s xvfb-run -a dbus-run-session -- "$RUNNER_TEMP/momo-appcheck"
      - name: Package unsigned preview
        run: |
          export PREVIEW_DIR="$RUNNER_TEMP/momo-app-preview"
          mkdir -p "$PREVIEW_DIR"
          cp README.md "$PREVIEW_DIR/README.md"
          if [ "$RUNNER_OS" = Windows ]; then
            cp "$RUNNER_TEMP/momo-preview-${RUNNER_OS}-${RUNNER_ARCH}" "$PREVIEW_DIR/momo-preview.exe"
          elif [ "$RUNNER_OS" = macOS ]; then
            mkdir -p "$PREVIEW_DIR/MOMO Preview.app/Contents/MacOS"
            cp "$RUNNER_TEMP/momo-preview-${RUNNER_OS}-${RUNNER_ARCH}" "$PREVIEW_DIR/MOMO Preview.app/Contents/MacOS/momo-preview"
            cp packaging/Info.plist "$PREVIEW_DIR/MOMO Preview.app/Contents/Info.plist"
          else
            cp "$RUNNER_TEMP/momo-preview-${RUNNER_OS}-${RUNNER_ARCH}" "$PREVIEW_DIR/momo-preview"
          fi
          python3 -c 'import os,pathlib,hashlib; p=pathlib.Path(os.environ["PREVIEW_DIR"]); rows=[hashlib.sha256(f.read_bytes()).hexdigest()+"  "+f.relative_to(p).as_posix() for f in sorted(p.rglob("*")) if f.is_file()]; (p/"SHA256SUMS").write_text("\n".join(rows)+"\n",encoding="utf-8")'
      - name: Archive with native executable permissions
        run: |
          mkdir -p "$RUNNER_TEMP/momo-app-download"
          export DOWNLOAD_DIR="$RUNNER_TEMP/momo-app-download"
          python3 -c 'import os,pathlib,tarfile; p=pathlib.Path(os.environ["DOWNLOAD_DIR"]); name="momo-preview-"+os.environ["RUNNER_OS"]+"-"+os.environ["RUNNER_ARCH"]+".tar.gz"; archive=tarfile.open(p/name,"w:gz"); archive.add(pathlib.Path(os.environ["RUNNER_TEMP"])/"momo-app-preview",arcname="."); archive.close()'
          python3 -c 'import os,pathlib,hashlib; p=pathlib.Path(os.environ["DOWNLOAD_DIR"]); rows=[hashlib.sha256(f.read_bytes()).hexdigest()+"  "+f.name for f in sorted(p.glob("*.tar.gz"))]; (p/"SHA256SUMS").write_text("\n".join(rows)+"\n",encoding="utf-8")'
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-momo-preview-${{ runner.os }}-${{ runner.arch }}
          path: ${{ runner.temp }}/momo-app-download/
          if-no-files-found: error
          retention-days: 7
